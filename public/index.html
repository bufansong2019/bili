<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1014" />
<title>bili</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-shuffle" viewBox="0 0 24 24">
      <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22" />
      <path d="m18 2 4 4-4 4" />
      <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2" />
      <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8" />
      <path d="m18 14 4 4-4 4" />
    </symbol>
    <symbol id="icon-skip-back" viewBox="0 0 24 24">
      <polygon points="19 20 9 12 19 4 19 20" />
      <line x1="5" x2="5" y1="19" y2="5" />
    </symbol>
    <symbol id="icon-skip-forward" viewBox="0 0 24 24">
      <polygon points="5 4 15 12 5 20 5 4" />
      <line x1="19" x2="19" y1="5" y2="19" />
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <polygon points="6 3 20 12 6 21 6 3" />
    </symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24">
      <rect x="14" y="4" width="4" height="16" rx="1" />
      <rect x="6" y="4" width="4" height="16" rx="1" />
    </symbol>
    <symbol id="icon-arrow-right-to-line" viewBox="0 0 24 24">
      <path d="M17 12H3" />
      <path d="m11 18 6-6-6-6" />
      <path d="M21 5v14" />
    </symbol>
    <symbol id="icon-repeat" viewBox="0 0 24 24">
      <path d="m17 2 4 4-4 4" />
      <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
      <path d="m7 22-4-4 4-4" />
      <path d="M21 13v1a4 4 0 0 1-4 4H3" />
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6" />
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24">
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-inner">
      <form class="search" id="bvid-form">
        <input
          id="bvid-input"
          type="text"
          placeholder="在此粘贴 BV 号"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="go"
        />
        <button type="submit" id="bvid-button">播放</button>
      </form>
      <div class="status" id="status" hidden></div>
    </div>
  </header>

  <div class="app">
    <section class="favorites" aria-label="我的收藏">
      <h2 class="favorites-title">我的收藏</h2>
      <p class="favorites-empty" id="favorites-empty">
        还没有收藏
      </p>
      <ul class="favorites-list" id="favorites-list"></ul>
    </section>
  </div>

  <footer class="player" id="player" hidden>
    <div class="player-track">
      <img class="player-cover" id="player-cover" alt="" />
      <div class="player-meta">
        <div class="player-title" id="player-title"></div>
        <div class="player-author" id="player-author"></div>
      </div>
    </div>

    <div class="player-controls">
      <button class="ctl fav" id="ctl-fav" title="收藏" aria-label="收藏" disabled>
        <svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg>
      </button>
      <button class="ctl" id="ctl-prev" title="上一首" aria-label="上一首">
        <svg class="icon" aria-hidden="true"><use href="#icon-skip-back"></use></svg>
      </button>
      <button class="ctl ctl-main" id="ctl-play" title="播放" aria-label="播放">
        <svg class="icon" aria-hidden="true"><use href="#icon-play"></use></svg>
      </button>
      <button class="ctl" id="ctl-next" title="下一首" aria-label="下一首">
        <svg class="icon" aria-hidden="true"><use href="#icon-skip-forward"></use></svg>
      </button>
      <button class="ctl" id="ctl-mode" title="顺序播放" aria-label="顺序播放">
        <svg class="icon" aria-hidden="true"><use href="#icon-arrow-right-to-line"></use></svg>
      </button>
    </div>

    <div class="player-progress">
      <span class="time" id="time-current">0:00</span>
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度" />
      <span class="time" id="time-total">0:00</span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" hidden>
    <span>已取消收藏</span>
    <button type="button" id="toast-undo">撤销</button>
  </div>

  <audio id="audio" preload="none"></audio>

  <script type="module" src="/app.js"></script>
</body>
</html>
